  <body>
        <h1>test</h1>
    <div id="root"></div>
    <script type="module" src="src/main.tsx"></script>

    <script>
      (function () {
        const repoPrefix = '/PantryPal/';
        const path = window.location.pathname;
        if (!path.startsWith(repoPrefix) && !path.endsWith('.html')) {
          const target = repoPrefix + (path.startsWith('/') ? path.slice(1) : path);
          window.location.replace(target + window.location.search + window.location.hash);
        }
      })();
    </script>
  </body>
</html>
