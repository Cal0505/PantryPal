<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PantryPal</title>
    <meta name="description" content="Fully offline mobile and tablet inventory management with barcode scanning, automated stock count, and best-by dates." />
    <meta name="theme-color" content="#0f172a" />
    <base href="/pantrypal/" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <script>
      // GitHub Pages SPA routing fix
      const base = '/pantrypal/';
      const p = window.location.pathname;
      if (p.startsWith(base) && p !== base && !p.includes('.')) {
        sessionStorage.setItem('spaRedirect', p);
        window.location.replace(base + '?' + window.location.search.slice(1));
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="src/main.tsx"></script>
  </body>
</html>
